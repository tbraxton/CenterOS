<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CenterOS Dashboard</title>
  <meta name="description" content="A dashboard for CenterOS workflows.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Workflow navigation">
      <a class="brand" href="index.html" aria-label="CenterOS Dashboard home">
        <img src="../images/centeros-logo-full.png" alt="CenterOS" width="190" height="50">
      </a>

      <nav class="workflow-nav" aria-label="Workflow dashboard links">
        <a class="nav-item active" href="pages/home.html" target="dashboard-frame">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-bar-chart-line"></i>
          </span>
          <span>Dashboard</span>
        </a>
        <!-- WORKFLOW_LINKS_START -->
        <a class="nav-item" href="pages/workflow-placeholder.html#workflow-1" target="dashboard-frame">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-file-earmark-text"></i>
          </span>
          <span>Workflow 1</span>
        </a>
        <a class="nav-item" href="pages/workflow-placeholder.html#workflow-2" target="dashboard-frame">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-calendar3"></i>
          </span>
          <span>Workflow 2</span>
        </a>
        <a class="nav-item" href="pages/workflow-placeholder.html#workflow-3" target="dashboard-frame">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-compass"></i>
          </span>
          <span>Workflow 3</span>
        </a>
        <a class="nav-item" href="pages/workflow-placeholder.html#workflow-4" target="dashboard-frame">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-lightbulb"></i>
          </span>
          <span>Workflow 4</span>
        </a>
        <a class="nav-item" href="pages/workflow-placeholder.html#workflow-5" target="dashboard-frame">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-sliders"></i>
          </span>
          <span>Workflow 5</span>
        </a>
        <!-- WORKFLOW_LINKS_END -->
      </nav>
    </aside>

    <main class="main-panel">
      <iframe
        class="dashboard-frame"
        name="dashboard-frame"
        title="CenterOS dashboard content"
        src="pages/home.html"
      ></iframe>
    </main>
  </div>

  <script>
    document.querySelectorAll(".workflow-nav .nav-item").forEach((item) => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".workflow-nav .nav-item").forEach((link) => link.classList.remove("active"));
        item.classList.add("active");
      });
    });
  </script>
</body>
</html>
