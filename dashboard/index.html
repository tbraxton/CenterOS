<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CenterOS Dashboard</title>
  <meta name="description" content="A dashboard for CenterOS workflows.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Workflow navigation">
      <a class="brand" href="index.html" aria-label="CenterOS Dashboard home">
        <img src="../images/centeros-logo-full.png" alt="CenterOS" width="190" height="50">
      </a>

      <nav class="workflow-nav" aria-label="Workflow dashboard links">
        <a class="nav-item active" href="#">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-bar-chart-line"></i>
          </span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-file-earmark-text"></i>
          </span>
          <span>Workflow 1</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-calendar3"></i>
          </span>
          <span>Workflow 2</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-compass"></i>
          </span>
          <span>Workflow 3</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-lightbulb"></i>
          </span>
          <span>Workflow 4</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon" aria-hidden="true">
            <i class="bi bi-sliders"></i>
          </span>
          <span>Workflow 5</span>
        </a>
      </nav>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="index.html">CenterOS</a>
          <span aria-hidden="true">/</span>
          <span>Dashboard</span>
        </nav>
        <div class="install-status" aria-label="Install status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Ready</span>
        </div>
      </header>

      <section class="dashboard-home" aria-labelledby="dashboard-title">
        <div class="center-message">
          <h1 id="dashboard-title">CenterOS Dashboard</h1>
          <p>A Dashboard For Your Workflows.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
