<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Placeholder page for future CenterOS workflow dashboards.">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="dashboard-frame-page">
  <header class="topbar">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="home.html">CenterOS</a>
      <span aria-hidden="true">/</span>
      <span>Workflows</span>

    <div class="install-status" aria-label="Install status">
      <span class="status-dot" aria-hidden="true"></span>
